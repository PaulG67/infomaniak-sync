<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Infomaniak Sync</title>
  <link rel="icon" href="/static/icon.svg" />
  <link rel="stylesheet" href="/static/styles.css?v={{ version }}" />
</head>
<body>
  <div class="wrap">
    <header>
      <img src="/static/icon.svg" alt="" width="48" height="48" />
      <div>
        <h1>Infomaniak Sync</h1>
        <p>Unraid-Shares mit kDrive abgleichen · Version {{ version }}</p>
      </div>
      <div class="header-meta" id="header-meta"></div>
    </header>
    <nav class="tabs">
      <button type="button" data-go="#/" data-tab="list">Aufträge</button>
      <button type="button" data-go="#/settings" data-tab="settings" class="tab-settings" title="Einstellungen">
        <svg class="tab-icon" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
          <path fill="currentColor" d="M19.14 12.94c.04-.31.06-.63.06-.94s-.02-.63-.06-.94l2.03-1.58a.5.5 0 0 0 .12-.64l-1.92-3.32a.5.5 0 0 0-.6-.22l-2.39.96a7.03 7.03 0 0 0-1.63-.94l-.36-2.54A.5.5 0 0 0 13.9 2h-3.8a.5.5 0 0 0-.49.42l-.36 2.54c-.6.24-1.15.55-1.63.94l-2.39-.96a.5.5 0 0 0-.6.22L2.71 8.48a.5.5 0 0 0 .12.64l2.03 1.58c-.04.31-.06.63-.06.94s.02.63.06.94L2.83 14.58a.5.5 0 0 0-.12.64l1.92 3.32c.14.24.43.34.68.22l2.39-.96c.48.39 1.03.71 1.63.94l.36 2.54c.05.24.25.42.49.42h3.8c.24 0 .44-.18.49-.42l.36-2.54c.6-.23 1.15-.55 1.63-.94l2.39.96c.25.12.54.02.68-.22l1.92-3.32a.5.5 0 0 0-.12-.64l-2.03-1.58zM12 15.5A3.5 3.5 0 1 1 12 8.5a3.5 3.5 0 0 1 0 7z"/>
        </svg>
        <span>Einstellungen</span>
      </button>
      <button type="button" data-go="#/history" data-tab="history">Verlauf</button>
    </nav>
    <div id="flash" class="flash hidden" role="alert"></div>
    <div id="app"></div>
  </div>
  <div id="modal" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="modal-title"></div>
  <script src="/static/app.js?v={{ version }}"></script>
</body>
</html>
